<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14181f">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icono.svg">
<link rel="apple-touch-icon" href="icono.svg">
<title>Mi Buen Fin</title>
<style>
:root {
  --fondo: #14181f; --panel: #1d232d; --panel-2: #29313e; --linea: #3b4554; --texto: #eef2f7; --tenue: #a3adbd;
  --verde: #5fd38d; --ambar: #ffbf47; --rojo: #ff7a7a; --acento: #5cc8ff;
  --ui: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--fondo); color: var(--texto); font: 16px/1.4 var(--ui); display: flex; flex-direction: column; overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--acento); outline-offset: 2px; }
[hidden] { display: none !important; }
header { padding: max(12px, env(safe-area-inset-top)) 16px 8px; display: flex; justify-content: space-between; align-items: baseline; }
header h1 { margin: 0; font-size: 20px; }
header span { color: var(--tenue); font-size: 13px; }
main { flex: 1; overflow-y: auto; padding: 4px 16px 96px; display: grid; gap: 12px; align-content: start; -webkit-overflow-scrolling: touch; }
.tarjeta { background: var(--panel); border-radius: 12px; padding: 14px; display: grid; gap: 8px; }
.tarjeta h2 { margin: 0; font-size: 14px; font-weight: 600; color: var(--tenue); text-transform: uppercase; letter-spacing: .04em; }
.grande { font-size: 34px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; }
.tenue { color: var(--tenue); font-size: 14px; }
.fila { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; font-variant-numeric: tabular-nums; }
.barra { height: 12px; border-radius: 6px; background: var(--panel-2); overflow: hidden; }
.barra > i { display: block; height: 100%; border-radius: 6px; background: var(--verde); }
.nivel-ambar .barra > i { background: var(--ambar); }
.nivel-rojo .barra > i { background: var(--rojo); }
.etiqueta { font-weight: 700; }
.nivel-verde .etiqueta { color: var(--verde); }
.nivel-ambar .etiqueta { color: var(--ambar); }
.nivel-rojo .etiqueta { color: var(--rojo); }
.alerta { border: 1px solid var(--rojo); color: var(--rojo); border-radius: 8px; padding: 8px 10px; font-size: 14px; }
.item { background: var(--panel); border-radius: 12px; padding: 12px 14px; display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; }
.item b { font-variant-numeric: tabular-nums; }
.item .borrar { grid-row: span 2; align-self: center; width: 44px; height: 44px; border: 0; border-radius: 8px; background: var(--panel-2); color: var(--tenue); font-size: 18px; }
.vacio { text-align: center; color: var(--tenue); padding: 32px 8px; }
nav { position: fixed; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: repeat(4, 1fr); background: var(--panel); border-top: 1px solid var(--linea); padding-bottom: env(safe-area-inset-bottom); z-index: 5; }
nav button { min-height: 56px; border: 0; background: none; color: var(--tenue); font-size: 13px; }
nav button[aria-current="page"] { color: var(--acento); font-weight: 700; }
#nueva { position: fixed; right: 16px; bottom: calc(72px + env(safe-area-inset-bottom)); z-index: 6; min-height: 52px; padding: 0 20px; border: 0; border-radius: 26px; background: var(--acento); color: #04202e; font-weight: 700; box-shadow: 0 4px 14px #0008; }
#hoja { position: fixed; inset: 0; z-index: 10; background: var(--fondo); overflow-y: auto; padding: max(12px, env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom)); display: grid; gap: 14px; align-content: start; }
label { display: grid; gap: 4px; font-size: 14px; color: var(--tenue); }
input, select, textarea { width: 100%; min-height: 48px; padding: 0 12px; border: 1px solid var(--linea); border-radius: 8px; background: var(--panel); color: var(--texto); font-size: 17px; }
textarea { padding: 10px 12px; min-height: 96px; font-size: 13px; font-family: ui-monospace, Consolas, monospace; }
.planes { display: flex; flex-wrap: wrap; gap: 8px; }
.plan { min-width: 56px; min-height: 44px; padding: 0 12px; border: 1px solid var(--linea); border-radius: 8px; background: var(--panel); }
.plan[aria-pressed="true"] { border-color: var(--acento); color: var(--acento); font-weight: 700; }
.primario, .secundario { min-height: 48px; padding: 0 16px; border: 0; border-radius: 8px; font-weight: 700; }
.primario { background: var(--acento); color: #04202e; }
.primario:disabled { opacity: .4; }
.secundario { background: var(--panel-2); }
.peligro { color: var(--rojo); }
.acciones { display: flex; gap: 8px; flex-wrap: wrap; }
.acciones > * { flex: 1; }
#aviso { position: fixed; left: 16px; right: 16px; top: max(12px, env(safe-area-inset-top)); z-index: 20; background: var(--panel-2); border: 1px solid var(--linea); padding: 10px 12px; border-radius: 8px; text-align: center; }
</style>
</head>
<body>
<header><h1>Mi Buen Fin</h1><span id="fecha-hoy"></span></header>
<main id="vista"></main>
<button id="nueva" type="button">+ Compra</button>
<nav id="menu"></nav>
<div id="hoja" hidden></div>
<div id="aviso" role="status" hidden></div>
<script>
(function (raiz, fabrica) {
  if (typeof module === "object" && module.exports) module.exports = fabrica();
  else raiz.Logica = fabrica();
})(typeof self !== "undefined" ? self : this, function () {
  var PLANES = [1, 3, 6, 9, 12, 18, 24];
  var TARJETAS = ["BBVA", "Banorte", "Banamex", "Invex", "Didi", "Nu", "Liverpool", "Otra"];
  var VERSION_RESPALDO = 1;
  var UMBRAL_AMBAR = 0.8;
  var FECHA = /^\d{4}-\d{2}-\d{2}$/;

  function pesosACentavos(texto) {
    var limpio = String(texto == null ? "" : texto).replace(/[$,\s]/g, "");
    if (!/^\d+(\.\d{1,2})?$/.test(limpio)) return null;
    var partes = limpio.split(".");
    var centavos = parseInt(partes[0], 10) * 100 + parseInt((partes[1] || "").padEnd(2, "0") || "0", 10);
    return centavos > 0 ? centavos : null;
  }

  function formatoMXN(centavos) {
    var negativo = centavos < 0;
    var abs = Math.abs(centavos);
    var enteros = String(Math.floor(abs / 100)).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
    var cents = String(abs % 100).padStart(2, "0");
    return (negativo ? "-" : "") + "$" + enteros + "." + cents;
  }

  function sumarMeses(mes, n) {
    var partes = mes.split("-");
    var total = parseInt(partes[0], 10) * 12 + (parseInt(partes[1], 10) - 1) + n;
    var anio = Math.floor(total / 12);
    return anio + "-" + String((total % 12) + 1).padStart(2, "0");
  }

  function mensualidades(compra, gracia) {
    var primero = sumarMeses(compra.fecha.slice(0, 7), gracia);
    var base = Math.floor(compra.monto / compra.meses);
    var residuo = compra.monto - base * compra.meses;
    var lista = [];
    for (var i = 0; i < compra.meses; i++) {
      lista.push({ mes: sumarMeses(primero, i), monto: i === compra.meses - 1 ? base + residuo : base });
    }
    return lista;
  }

  function calendario(compras, gracia) {
    var porMes = {};
    compras.forEach(function (c) {
      mensualidades(c, gracia).forEach(function (m) { porMes[m.mes] = (porMes[m.mes] || 0) + m.monto; });
    });
    return Object.keys(porMes).sort().map(function (mes) { return { mes: mes, total: porMes[mes] }; });
  }

  function totalComprado(compras) {
    return compras.reduce(function (s, c) { return s + c.monto; }, 0);
  }

  function semaforo(gastado, presupuesto) {
    if (!presupuesto || presupuesto <= 0) return { nivel: "sin", porcentaje: 0, restante: 0 };
    var razon = gastado / presupuesto;
    var nivel = razon >= 1 ? "rojo" : razon >= UMBRAL_AMBAR ? "ambar" : "verde";
    return { nivel: nivel, porcentaje: Math.floor(razon * 100), restante: presupuesto - gastado };
  }

  function mesesExcedidos(cal, tope) {
    if (!tope || tope <= 0) return [];
    return cal.filter(function (m) { return m.total > tope; }).map(function (m) { return m.mes; });
  }

  function agrupar(items, nombreDe, montoDe) {
    var acum = {};
    items.forEach(function (item) {
      var nombre = nombreDe(item);
      acum[nombre] = (acum[nombre] || 0) + montoDe(item);
    });
    return Object.keys(acum).map(function (nombre) { return { nombre: nombre, total: acum[nombre] }; })
      .sort(function (a, b) { return b.total - a.total || a.nombre.localeCompare(b.nombre, "es"); });
  }

  function porPersona(compras) {
    return agrupar(compras, function (c) { return (c.para || "").trim() || "Sin asignar"; }, function (c) { return c.monto; })
      .map(function (g) { return { para: g.nombre, total: g.total }; });
  }

  function porTarjeta(compras) {
    return agrupar(compras, function (c) { return c.tarjeta || "Sin tarjeta"; }, function (c) { return c.monto; })
      .map(function (g) { return { tarjeta: g.nombre, total: g.total }; });
  }

  function calendarioPorTarjeta(compras, gracia) {
    var cargos = [];
    compras.forEach(function (c) {
      mensualidades(c, gracia).forEach(function (m) { cargos.push({ mes: m.mes, tarjeta: c.tarjeta || "Sin tarjeta", monto: m.monto }); });
    });
    return calendario(compras, gracia).map(function (m) {
      var delMes = cargos.filter(function (x) { return x.mes === m.mes; });
      return {
        mes: m.mes,
        tarjetas: agrupar(delMes, function (x) { return x.tarjeta; }, function (x) { return x.monto; })
          .map(function (g) { return { tarjeta: g.nombre, total: g.total }; })
      };
    });
  }

  function simular(compras, config, nueva) {
    var hipotetica = { id: "simulada", fecha: nueva.fecha, tienda: "", concepto: "", para: "", monto: nueva.monto, meses: nueva.meses };
    var todas = compras.concat([hipotetica]);
    var totalDespues = totalComprado(todas);
    return {
      totalDespues: totalDespues,
      semaforo: semaforo(totalDespues, config.presupuesto),
      mesesExcedidos: mesesExcedidos(calendario(todas, config.gracia), config.topeMensual)
    };
  }

  function validarCompra(c) {
    return !!c && typeof c.id === "string" && c.id !== "" && typeof c.fecha === "string" && FECHA.test(c.fecha) &&
      typeof c.tienda === "string" && typeof c.concepto === "string" && typeof c.para === "string" &&
      Number.isInteger(c.monto) && c.monto > 0 && PLANES.indexOf(c.meses) >= 0 &&
      (c.tarjeta === undefined || c.tarjeta === "" || TARJETAS.indexOf(c.tarjeta) >= 0);
  }

  function exportar(compras, config) {
    return JSON.stringify({ version: VERSION_RESPALDO, compras: compras, config: config });
  }

  function importar(texto) {
    var datos;
    try { datos = JSON.parse(texto); } catch (e) { return null; }
    if (!datos || datos.version !== VERSION_RESPALDO || !Array.isArray(datos.compras) || !datos.config) return null;
    if (!datos.compras.every(validarCompra)) return null;
    return { compras: datos.compras, config: datos.config };
  }

  return {
    PLANES: PLANES, TARJETAS: TARJETAS, porTarjeta: porTarjeta, calendarioPorTarjeta: calendarioPorTarjeta, pesosACentavos: pesosACentavos, formatoMXN: formatoMXN, sumarMeses: sumarMeses,
    mensualidades: mensualidades, calendario: calendario, totalComprado: totalComprado, semaforo: semaforo,
    mesesExcedidos: mesesExcedidos, porPersona: porPersona, simular: simular, validarCompra: validarCompra,
    exportar: exportar, importar: importar
  };
});

</script>
<script>
(function () {
  "use strict";
  var L = Logica;
  var CLAVE = "buenfin-v1";
  var MESES = ["ene", "feb", "mar", "abr", "may", "jun", "jul", "ago", "sep", "oct", "nov", "dic"];
  var PESTANAS = [["resumen", "Resumen"], ["compras", "Compras"], ["meses", "Meses"], ["ajustes", "Ajustes"]];
  var CONFIG_INICIAL = { presupuesto: null, topeMensual: null, gracia: 1 };
  var TEXTO_NIVEL = {
    sin: "Define tu presupuesto en Ajustes para ver el semáforo.",
    verde: "Vas bien.",
    ambar: "Ojo: ya usaste más del 80 % de tu presupuesto.",
    rojo: "Llegaste o te pasaste de tu presupuesto."
  };
  var estado = cargar();
  var pestana = "resumen";
  var temporizadorAviso = 0;

  function cargar() {
    try {
      var texto = localStorage.getItem(CLAVE);
      var datos = texto && L.importar(texto);
      if (datos) return { compras: datos.compras, config: Object.assign({}, CONFIG_INICIAL, datos.config) };
    } catch (e) { return { compras: [], config: Object.assign({}, CONFIG_INICIAL) }; }
    return { compras: [], config: Object.assign({}, CONFIG_INICIAL) };
  }

  function guardar() {
    try { localStorage.setItem(CLAVE, L.exportar(estado.compras, estado.config)); }
    catch (e) { avisar("No se pudo guardar en este navegador. Exporta un respaldo."); }
  }

  function h(tag, attrs) {
    var nodo = document.createElement(tag);
    var claves = Object.keys(attrs || {});
    claves.forEach(function (k) {
      var v = attrs[k];
      if (k === "class") nodo.className = v;
      else if (k.indexOf("on") === 0) nodo.addEventListener(k.slice(2), v);
      else if (v !== false && v != null) nodo.setAttribute(k, v === true ? "" : v);
    });
    Array.prototype.slice.call(arguments, 2).forEach(function añadir(hijo) {
      if (Array.isArray(hijo)) return hijo.forEach(añadir);
      if (hijo == null || hijo === false) return;
      nodo.append(hijo.nodeType ? hijo : document.createTextNode(String(hijo)));
    });
    return nodo;
  }

  function avisar(texto) {
    var caja = document.getElementById("aviso");
    caja.textContent = texto;
    caja.hidden = false;
    clearTimeout(temporizadorAviso);
    temporizadorAviso = setTimeout(function () { caja.hidden = true; }, 3500);
  }

  function hoy() {
    var d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }

  function nombreMes(mes) {
    var p = mes.split("-");
    return MESES[parseInt(p[1], 10) - 1] + " " + p[0];
  }

  function tarjetaSemaforo() {
    var total = L.totalComprado(estado.compras);
    var s = L.semaforo(total, estado.config.presupuesto);
    var ancho = s.nivel === "sin" ? 0 : Math.min(100, s.porcentaje);
    var barra = h("i"); barra.style.width = ancho + "%";
    return h("section", { class: "tarjeta nivel-" + s.nivel },
      h("h2", null, "Llevas comprado"),
      h("div", { class: "grande" }, L.formatoMXN(total)),
      s.nivel !== "sin" && h("div", { class: "barra", role: "img", "aria-label": s.porcentaje + " % del presupuesto" }, barra),
      s.nivel !== "sin" && h("div", { class: "fila" },
        h("span", null, "de " + L.formatoMXN(estado.config.presupuesto) + " (" + s.porcentaje + " %)"),
        h("b", null, s.restante >= 0 ? "Quedan " + L.formatoMXN(s.restante) : "Excedido " + L.formatoMXN(-s.restante))),
      h("div", { class: "etiqueta" }, TEXTO_NIVEL[s.nivel]));
  }

  function tarjetaProximosMeses() {
    var cal = L.calendario(estado.compras, estado.config.gracia);
    if (!cal.length) return null;
    var excedidos = L.mesesExcedidos(cal, estado.config.topeMensual);
    return h("section", { class: "tarjeta" },
      h("h2", null, "Lo que pagarás por mes"),
      cal.slice(0, 4).map(function (m) {
        return h("div", { class: "fila" }, h("span", null, nombreMes(m.mes)), h("b", null, L.formatoMXN(m.total)));
      }),
      excedidos.length > 0 && h("div", { class: "alerta" },
        "Rebasas tu tope mensual (" + L.formatoMXN(estado.config.topeMensual) + ") en: " + excedidos.map(nombreMes).join(", ")));
  }

  function tarjetaPersonas() {
    var lista = L.porPersona(estado.compras);
    if (!lista.length) return null;
    return h("section", { class: "tarjeta" }, h("h2", null, "Por persona"),
      lista.map(function (p) {
        return h("div", { class: "fila" }, h("span", null, p.para), h("b", null, L.formatoMXN(p.total)));
      }));
  }

  function tarjetaTarjetas() {
    var lista = L.porTarjeta(estado.compras);
    if (!lista.length) return null;
    return h("section", { class: "tarjeta" }, h("h2", null, "Por tarjeta"),
      lista.map(function (t) {
        return h("div", { class: "fila" }, h("span", null, t.tarjeta), h("b", null, L.formatoMXN(t.total)));
      }));
  }

  function vistaResumen() {
    if (!estado.compras.length) {
      return [tarjetaSemaforo(), h("p", { class: "vacio" }, "Aún no hay compras. Toca «+ Compra» cuando pagues algo.")];
    }
    return [tarjetaSemaforo(), tarjetaProximosMeses(), tarjetaTarjetas(), tarjetaPersonas()];
  }

  function detallePlan(c) {
    if (c.meses === 1) return "Contado";
    return c.meses + " MSI de " + L.formatoMXN(L.mensualidades(c, 0)[0].monto);
  }

  function borrarCompra(id) {
    if (!confirm("¿Borrar esta compra?")) return;
    estado.compras = estado.compras.filter(function (c) { return c.id !== id; });
    guardar();
    render();
  }

  function vistaCompras() {
    if (!estado.compras.length) return [h("p", { class: "vacio" }, "Todavía no registras compras.")];
    var ordenadas = estado.compras.slice().sort(function (a, b) { return b.fecha.localeCompare(a.fecha) || b.id.localeCompare(a.id); });
    return ordenadas.map(function (c) {
      return h("div", { class: "item" },
        h("b", null, c.concepto || c.tienda || "Compra"),
        h("button", { class: "borrar", type: "button", "aria-label": "Borrar compra", onclick: function () { borrarCompra(c.id); } }, "✕"),
        h("span", { class: "tenue" }, [c.tarjeta, c.tienda, c.para && "para " + c.para, c.fecha, detallePlan(c)].filter(Boolean).join(" · ")),
        h("b", null, L.formatoMXN(c.monto)));
    });
  }

  function vistaMeses() {
    var cal = L.calendario(estado.compras, estado.config.gracia);
    if (!cal.length) return [h("p", { class: "vacio" }, "Aquí verás cuánto pagarás cada mes, incluidos los meses sin intereses.")];
    var tope = estado.config.topeMensual;
    var maximo = Math.max.apply(null, cal.map(function (m) { return m.total; }).concat(tope || 0));
    var excedidos = L.mesesExcedidos(cal, tope);
    var desglose = L.calendarioPorTarjeta(estado.compras, estado.config.gracia);
    return cal.map(function (m, i) {
      var pasa = excedidos.indexOf(m.mes) >= 0;
      var barra = h("i"); barra.style.width = Math.round((m.total / maximo) * 100) + "%";
      return h("div", { class: "tarjeta nivel-" + (pasa ? "rojo" : "verde") },
        h("div", { class: "fila" }, h("b", null, nombreMes(m.mes)), h("b", null, L.formatoMXN(m.total))),
        h("div", { class: "barra" }, barra),
        desglose[i].tarjetas.map(function (t) {
          return h("div", { class: "fila tenue" }, h("span", null, t.tarjeta), h("span", null, L.formatoMXN(t.total)));
        }),
        pasa && h("div", { class: "etiqueta" }, "Pasa tu tope por " + L.formatoMXN(m.total - tope)));
    });
  }

  function campoDinero(id, etiqueta, valor) {
    return h("label", null, etiqueta,
      h("input", { id: id, inputmode: "decimal", placeholder: "Sin definir", value: valor ? (valor / 100).toFixed(2) : "" }));
  }

  function guardarAjustes() {
    var pres = L.pesosACentavos(document.getElementById("a-pres").value);
    var tope = L.pesosACentavos(document.getElementById("a-tope").value);
    estado.config = { presupuesto: pres, topeMensual: tope, gracia: parseInt(document.getElementById("a-gracia").value, 10) };
    guardar();
    avisar("Ajustes guardados");
    render();
  }

  function descargarRespaldo(texto) {
    var enlace = h("a", { href: URL.createObjectURL(new Blob([texto], { type: "application/json" })), download: "buen-fin-respaldo.json" });
    document.body.append(enlace);
    enlace.click();
    enlace.remove();
  }

  function copiarRespaldo(caja) {
    caja.select();
    var listo = navigator.clipboard ? navigator.clipboard.writeText(caja.value) : Promise.reject();
    listo.then(function () { avisar("Respaldo copiado"); }, function () { avisar("Selecciona el texto y cópialo a mano"); });
  }

  function importarRespaldo() {
    var datos = L.importar(document.getElementById("a-importar").value);
    if (!datos) return avisar("Ese texto no es un respaldo válido");
    if (!confirm("Esto reemplaza tus " + estado.compras.length + " compras actuales. ¿Continuar?")) return;
    estado = { compras: datos.compras, config: Object.assign({}, CONFIG_INICIAL, datos.config) };
    guardar();
    avisar("Respaldo restaurado");
    render();
  }

  function borrarTodo() {
    if (!confirm("¿Borrar TODAS las compras y ajustes de este celular?")) return;
    estado = { compras: [], config: Object.assign({}, CONFIG_INICIAL) };
    guardar();
    render();
  }

  function vistaAjustes() {
    var respaldo = L.exportar(estado.compras, estado.config);
    var caja = h("textarea", { readonly: true, "aria-label": "Respaldo" }, respaldo);
    return [
      h("section", { class: "tarjeta" }, h("h2", null, "Presupuesto"),
        campoDinero("a-pres", "Presupuesto total ($)", estado.config.presupuesto),
        campoDinero("a-tope", "Tope de pago por mes ($)", estado.config.topeMensual),
        h("label", null, "¿Cuándo cae el primer pago?",
          h("select", { id: "a-gracia" },
            h("option", { value: "0", selected: estado.config.gracia === 0 }, "El mismo mes de la compra"),
            h("option", { value: "1", selected: estado.config.gracia === 1 }, "El mes siguiente (por la fecha de corte)"))),
        h("button", { class: "primario", type: "button", onclick: guardarAjustes }, "Guardar ajustes")),
      h("section", { class: "tarjeta" }, h("h2", null, "Respaldo"),
        h("p", { class: "tenue" }, "Tus datos viven solo en este celular. Guarda un respaldo antes de borrar datos del navegador o cambiar de teléfono."),
        caja,
        h("div", { class: "acciones" },
          h("button", { class: "secundario", type: "button", onclick: function () { copiarRespaldo(caja); } }, "Copiar"),
          h("button", { class: "secundario", type: "button", onclick: function () { descargarRespaldo(respaldo); } }, "Descargar")),
        h("textarea", { id: "a-importar", placeholder: "Pega aquí un respaldo para restaurarlo", "aria-label": "Respaldo a restaurar" }),
        h("button", { class: "secundario", type: "button", onclick: importarRespaldo }, "Restaurar respaldo")),
      h("button", { class: "secundario peligro", type: "button", onclick: borrarTodo }, "Borrar todo")
    ];
  }

  var VISTAS = { resumen: vistaResumen, compras: vistaCompras, meses: vistaMeses, ajustes: vistaAjustes };

  function renderMenu() {
    var menu = document.getElementById("menu");
    menu.replaceChildren.apply(menu, PESTANAS.map(function (p) {
      return h("button", { type: "button", "aria-current": p[0] === pestana ? "page" : false, onclick: function () { pestana = p[0]; render(); } }, p[1]);
    }));
  }

  function render() {
    var vista = document.getElementById("vista");
    vista.replaceChildren.apply(vista, VISTAS[pestana]().filter(Boolean));
    renderMenu();
    document.getElementById("nueva").hidden = pestana === "ajustes";
  }

  function previsualizar(borrador, destino) {
    var monto = L.pesosACentavos(borrador.monto);
    destino.replaceChildren();
    if (!monto) return;
    var sim = L.simular(estado.compras, estado.config, { monto: monto, meses: borrador.meses, fecha: borrador.fecha });
    destino.className = "tarjeta nivel-" + sim.semaforo.nivel;
    destino.append(h("div", { class: "etiqueta" }, sim.semaforo.nivel === "sin" ? "Sin presupuesto definido" : "Quedarías en " + sim.semaforo.porcentaje + " % del presupuesto"));
    if (sim.semaforo.nivel !== "sin") destino.append(h("div", { class: "tenue" }, sim.semaforo.restante >= 0 ? "Te quedarían " + L.formatoMXN(sim.semaforo.restante) : "Te pasarías por " + L.formatoMXN(-sim.semaforo.restante)));
    if (sim.mesesExcedidos.length) destino.append(h("div", { class: "alerta" }, "Rebasaría tu tope mensual en: " + sim.mesesExcedidos.map(nombreMes).join(", ")));
  }

  function abrirFormulario() {
    var borrador = { monto: "", meses: 1, fecha: hoy(), tarjeta: "" };
    var hoja = document.getElementById("hoja");
    var previa = h("section");
    var botonGuardar = h("button", { class: "primario", type: "button", disabled: true }, "Guardar compra");
    var planes = h("div", { class: "planes" });
    var tarjetas = h("div", { class: "planes" });
    var campos = {};
    function actualizar() {
      tarjetas.replaceChildren.apply(tarjetas, L.TARJETAS.map(function (nombre) {
        var activa = nombre === borrador.tarjeta;
        return h("button", { class: "plan", type: "button", "aria-pressed": String(activa), onclick: function () { borrador.tarjeta = activa ? "" : nombre; actualizar(); } }, nombre);
      }));
      planes.replaceChildren.apply(planes, L.PLANES.map(function (n) {
        return h("button", { class: "plan", type: "button", "aria-pressed": String(n === borrador.meses), onclick: function () { borrador.meses = n; actualizar(); } }, n === 1 ? "Contado" : n + " MSI");
      }));
      botonGuardar.disabled = !L.pesosACentavos(borrador.monto);
      previsualizar(borrador, previa);
    }
    function campo(clave, etiqueta, atributos) {
      campos[clave] = h("input", Object.assign({ id: "f-" + clave, oninput: function (e) { borrador[clave] = e.target.value; actualizar(); } }, atributos));
      return h("label", null, etiqueta, campos[clave]);
    }
    var conocidos = L.porPersona(estado.compras).map(function (p) { return h("option", { value: p.para }); });
    botonGuardar.addEventListener("click", function () {
      var texto = function (clave) { return (campos[clave].value || "").trim(); };
      estado.compras = estado.compras.concat([{
        id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), fecha: campos.fecha.value || hoy(),
        tienda: texto("tienda"), concepto: texto("concepto"), para: texto("para"),
        monto: L.pesosACentavos(borrador.monto), meses: borrador.meses, tarjeta: borrador.tarjeta
      }]);
      guardar();
      hoja.hidden = true;
      avisar("Compra guardada");
      render();
    });
    hoja.replaceChildren(
      h("h1", null, "Nueva compra"),
      campo("monto", "Monto total ($)", { inputmode: "decimal", placeholder: "0.00", autocomplete: "off" }),
      h("div", null, h("div", { class: "tenue" }, "Forma de pago"), planes),
      h("div", null, h("div", { class: "tenue" }, "Tarjeta con la que pagaste"), tarjetas),
      previa,
      campo("concepto", "¿Qué compraste?", { placeholder: "Bocina, juguete…", autocomplete: "off" }),
      campo("tienda", "Tienda", { placeholder: "Liverpool, Amazon…", autocomplete: "off" }),
      campo("para", "¿Para quién?", { list: "personas", placeholder: "Mamá, Casa…", autocomplete: "off" }),
      h("datalist", { id: "personas" }, conocidos),
      campo("fecha", "Fecha", { type: "date", value: borrador.fecha }),
      h("div", { class: "acciones" },
        h("button", { class: "secundario", type: "button", onclick: function () { hoja.hidden = true; } }, "Cancelar"),
        botonGuardar));
    hoja.hidden = false;
    actualizar();
    campos.monto.focus();
  }

  document.getElementById("nueva").addEventListener("click", abrirFormulario);
  document.getElementById("fecha-hoy").textContent = hoy();
  if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) navigator.serviceWorker.register("sw.js");
  render();
})();
</script>
</body>
</html>
